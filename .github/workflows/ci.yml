name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          # Сборка актуальным SDK: приложение получает текущее оформление системы.
          xcodebuild -version
          sw_vers
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package SinCombo.app
        run: ./scripts/build-app.sh

      - name: Smoke test (приложение не падает при запуске)
        run: |
          build/SinCombo.app/Contents/MacOS/SinCombo > smoke.log 2>&1 &
          PID=$!
          sleep 8
          screencapture -x build/screen.png || true
          # Открываем панель щелчком по значку: проверяем, что модули не роняют приложение при первом опросе системы.
          osascript -e 'tell application "System Events" to click menu bar item 1 of menu bar 2 of process "SinCombo"' || echo "Панель открыть не удалось (нет доступа к управлению интерфейсом)"
          sleep 6
          screencapture -x build/panel.png || true
          if kill -0 $PID 2>/dev/null; then
            echo "Процесс жив через 10 с"
            kill $PID
          else
            wait $PID || echo "Код выхода: $?"
            cat smoke.log
            sleep 5
            for f in ~/Library/Logs/DiagnosticReports/SinCombo*; do [ -f "$f" ] && head -120 "$f"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SinCombo-app
          path: |
            build/SinCombo.zip
            build/SinCombo.zip.sha256
            build/screen.png
            build/panel.png

      - name: Release notes from tag message
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP/,$d' > build/RELEASE_NOTES.md
          cat build/RELEASE_NOTES.md

      # Публикация штатным gh, без сторонних действий с правом записи в репозиторий.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/SinCombo.zip build/SinCombo.zip.sha256 \
            --verify-tag --title "${GITHUB_REF_NAME}" --notes-file build/RELEASE_NOTES.md
